name: GitHub Pages'e dagit

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository'yi al
        uses: actions/checkout@v6

      - name: Node.js ortamini hazirla
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Bagimliliklari kur
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Production build olustur
        run: npm run build

      - name: GitHub Pages'i yapilandir
        uses: actions/configure-pages@v5

      - name: Build ciktisini yukle
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages'e dagit
        id: deployment
        uses: actions/deploy-pages@v4

